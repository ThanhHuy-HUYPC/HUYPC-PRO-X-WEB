<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>HUYPC KEY MANAGER</title><style>body{background:#050509;color:#eee;font:14px Arial;max-width:1100px;margin:auto;padding:25px}section{background:#11111a;border:1px solid #492568;border-radius:16px;padding:20px;margin:15px 0}input,select,button{padding:11px;border-radius:9px;background:#09090f;color:#fff;border:1px solid #63358b;margin:4px}button{background:#7c3aed;border:0}.key{font-family:monospace;color:#d8b4fe}</style><h1>HUYPC PRO X — KEY MANAGER</h1><section id=l>🔐 <input id=sec type=password placeholder=ADMIN_SECRET><button onclick=login()>LOGIN</button></section><section id=p hidden><h2>CREATE KEY</h2><select id=pl><option>1D</option><option>7D</option><option selected>30D</option><option>LIFETIME</option></select><input id=md type=number value=1 min=1><button onclick=create()>CREATE</button><b id=created></b><hr><input id=q placeholder="Search" oninput=render()><div id=t></div></section><script>let secret="",data=[];async function api(x={},m="POST"){let r=await fetch("/api/admin",{method:m,headers:{"content-type":"application/json","x-admin-secret":secret},body:m==="GET"?null:JSON.stringify(x)});return r.json()}async function login(){secret=sec.value;let r=await api({}, "GET");if(r.ok){l.hidden=true;p.hidden=false;data=r.licenses;render()}else alert("Sai ADMIN_SECRET")}async function create(){let r=await api({action:"create",plan:pl.value,maxDevices:md.value});if(r.ok){created.textContent=r.license.key;load()}}async function load(){data=(await api({}, "GET")).licenses;render()}async function act(a,k){await api({action:a,key:k});load()}function render(){t.innerHTML=data.filter(x=>x.key.includes((q.value||"").toUpperCase())).map(x=>`<section><span class=key>${x.key}</span><br>${x.plan} | ${x.status} | devices ${x.devices.length}/${x.maxDevices}<br><button onclick="navigator.clipboard.writeText('${x.key}')">COPY</button><button onclick="act('reset-device','${x.key}')">RESET DEVICE</button><button onclick="act('${x.status==='banned'?'unban':'ban'}','${x.key}')">${x.status==='banned'?'UNBAN':'BAN'}</button><button onclick="act('delete','${x.key}')">DELETE</button></section>`).join("")}</script>
