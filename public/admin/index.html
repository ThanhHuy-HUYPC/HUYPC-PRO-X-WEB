<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HUYPC PRO X — KEY MANAGER</title><link rel="stylesheet" href="/admin/style.css"></head><body><main><header><div><b>HUYPC</b><h1>PRO X KEY MANAGER</h1><p>License Control Center</p></div><span id="badge">OFFLINE</span></header><section id="login" class="card"><h2>🔐 ADMIN LOGIN</h2><p>Nhập ADMIN_SECRET đã tạo trong Netlify.</p><div class="field"><input id="secret" type="password" placeholder="ADMIN_SECRET"><button id="eye">👁</button></div><button id="loginBtn" class="primary">ĐĂNG NHẬP</button><div id="msg"></div></section><section id="panel" hidden><div class="stats"><div class="card"><b id="total">0</b><small>TỔNG KEY</small></div><div class="card"><b id="active">0</b><small>ACTIVE</small></div><div class="card"><b id="blocked">0</b><small>HẾT HẠN / BAN</small></div></div><section class="card"><h2>➕ TẠO LICENSE</h2><select id="plan"><option value="1D">1 NGÀY</option><option value="7D">7 NGÀY</option><option value="30D" selected>30 NGÀY</option><option value="LIFETIME">LIFETIME</option></select><input id="devices" type="number" min="1" value="1"><button id="create" class="primary">TẠO KEY</button><div id="created"></div></section><section class="card"><h2>📋 LICENSES</h2><input id="search" placeholder="Tìm license..."><div id="table"></div></section><button id="logout">ĐĂNG XUẤT</button></section><script src="/admin/app.js"></script></body></html>
